name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[excel]'
      - run: python -m unittest discover -s tests -v
      - name: Generate and validate single-axis demo
        run: |
          taskgen generate --input examples/atomic_tasks.json --config config.example.json --output generated/ci --xlsx
          taskgen validate --input generated/ci/tasks.jsonl --config config.example.json
          diff examples/expected/tasks.jsonl generated/ci/tasks.jsonl
          diff examples/expected/report.json generated/ci/report.json
      - name: Generate cross-mode and CSV demos
        run: |
          taskgen generate --input examples/atomic_tasks.json --config config.example.json --mode cross --output generated/cross
          taskgen validate --input generated/cross/tasks.jsonl --config config.example.json
          taskgen generate --input examples/atomic_tasks.csv --config config.example.json --output generated/csv
          diff generated/ci/tasks.jsonl generated/csv/tasks.jsonl
      - name: Map customer sheet and create pending review
        run: |
          taskgen import-sheet --input examples/customer_tasks.csv --mapping examples/customer_mapping.json --config config.example.json --output generated/import
          taskgen generate --input generated/import/imported_tasks.json --config config.example.json --output generated/customer
          diff generated/ci/tasks.jsonl generated/customer/tasks.jsonl
          taskgen create-review --input generated/customer/tasks.jsonl --config config.example.json --output generated/review.xlsx
